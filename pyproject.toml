[project]
name = "videospec"
version = "0.1.0"
description = "Dockerized, one-shot ffmpeg-orchestration service that edits videos from a YAML spec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.scripts]
videospec = "videospec.entrypoint:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videospec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "C90"]

[tool.ruff.lint.mccabe]
# Keep cyclomatic complexity low per project requirements.
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=videospec --cov-report=term-missing"
markers = [
    "integration: tests that invoke real ffmpeg/ffprobe (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["videospec"]

[tool.coverage.report]
show_missing = true
